<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff3f1">
  <title>A little something for you</title>
  <link rel="preload" href="/assets/caveat-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/caveat-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script>
    // Keep the page hidden until the handwriting fonts are ready (at most 2.5 s), so the text never
    // shows in a plain font first and then jumps.
    (function () {
      var root = document.documentElement;
      root.classList.add("fonts-wait");
      var done = function () { root.classList.remove("fonts-wait"); };
      if (!document.fonts || !document.fonts.load) return done();
      Promise.all([document.fonts.load("700 1em Caveat"), document.fonts.load("500 1em Caveat")]).then(done, done);
      setTimeout(done, 2500);
    })();
  </script>
</head>
<body data-view="greet">
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i>
    <i class="orb o2"></i>
    <i class="orb o3"></i>
    <canvas id="magic"></canvas>
  </div>

  <!-- Where an old or used-up gift link leads: a warm message that suits anyone, with no personal details -->
  <main id="app">
    <section class="view active">
      <article class="letter" data-size="m">
        <h2 class="script">Dear you,</h2>
        <p class="script body">Somewhere, someone thought of you and wanted to make your day a little brighter.

Whoever you are to them, a friend, a parent, a partner or family, you matter more than you know.

Take a moment to breathe and smile. You are loved, and you are never alone.

With warm wishes, always.</p>
        <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="wax" cx=".35" cy=".3" r=".9">
              <stop offset="0" stop-color="#ff6b8c"/>
              <stop offset=".6" stop-color="#c9184a"/>
              <stop offset="1" stop-color="#8e0a34"/>
            </radialGradient>
          </defs>
          <path d="M32 3c5 0 7 4 12 4s8 3 9 8 5 6 6 11-3 8-3 13 1 9-4 12-7 3-11 5-7 5-11 5-7-4-11-5-8-1-11-5-3-7-3-12-4-8-3-13 5-6 6-11 4-8 9-8 7-4 12-4z" fill="url(#wax)"/>
          <path d="M32 46C18 36 14 27 20 21c4-4 10-3 12 2 2-5 8-6 12-2 6 6 2 15-12 25z" fill="none" stroke="#ffb3c4" stroke-opacity=".85" stroke-width="2"/>
        </svg>
      </article>
    </section>
  </main>

  <script src="/magic.js"></script>
</body>
</html>
